[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stockchecker"
version = "2.0.0"
description = "Discord stock notifications with Disney Store support"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "discord.py>=2.6,<3",
  "lxml>=6,<7",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["stockchecker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
